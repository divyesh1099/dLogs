name: Deploy ntfy to Railway

on:
  push:
    branches: [main]
    paths:
      - "deploy/ntfy/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug Railway token scope
        working-directory: deploy/ntfy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway status --json || true

      - name: Deploy to Railway (uses deploy/ntfy/railway.json)
        working-directory: deploy/ntfy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service dLogs --detach
